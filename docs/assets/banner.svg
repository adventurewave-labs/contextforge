<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 315" width="1200" height="315" role="img" aria-label="ContextForge banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#131a28"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff7847"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="315" fill="url(#bg)"/>
  <rect width="1200" height="315" fill="url(#glow)"/>

  <!-- logo mark -->
  <rect x="90" y="80" width="120" height="120" rx="30" fill="#10141d" stroke="url(#acc)" stroke-width="4"/>
  <path d="M157 100 L118 152 h24 L131 182 178 128 h-24 z" fill="url(#acc)"/>

  <!-- title -->
  <text x="250" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="url(#acc)">ContextForge</text>
  <text x="254" y="190" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#dbe4f0">Forge lean LLM contexts. Keep every fact.</text>
  <text x="254" y="228" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" fill="#8b98ac">compress up to 20x · verify faithfulness · watch the savings</text>

  <!-- fact chips -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="14">
    <rect x="254" y="250" width="150" height="30" rx="8" fill="none" stroke="#232c3b"/>
    <text x="270" y="270" fill="#4ade80">✓ facts kept</text>
    <rect x="416" y="250" width="180" height="30" rx="8" fill="none" stroke="#232c3b"/>
    <text x="432" y="270" fill="#fbbf24">⚡ 3–20x smaller</text>
    <rect x="608" y="250" width="200" height="30" rx="8" fill="none" stroke="#232c3b"/>
    <text x="624" y="270" fill="#ffb347">$ savings ledger</text>
  </g>

  <!-- token stream visual -->
  <g>
    <rect x="860" y="70" width="250" height="150" rx="12" fill="#10141d" stroke="#232c3b"/>
    <text x="880" y="98" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#8b98ac">200K tokens → 20K</text>
    <rect x="880" y="112" width="210" height="10" rx="5" fill="#2a3547"/>
    <rect x="880" y="112" width="200" height="10" rx="5" fill="#ff7847" opacity="0.5"/>
    <rect x="880" y="130" width="210" height="10" rx="5" fill="#2a3547"/>
    <rect x="880" y="130" width="180" height="10" rx="5" fill="#ff8c47" opacity="0.4"/>
    <rect x="880" y="148" width="210" height="10" rx="5" fill="#2a3547"/>
    <rect x="880" y="148" width="60" height="10" rx="5" fill="#ffb347"/>
    <rect x="880" y="166" width="210" height="10" rx="5" fill="#2a3547"/>
    <rect x="880" y="166" width="110" height="10" rx="5" fill="#ffb347"/>
    <text x="880" y="200" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#4ade80">−$0.88 per Opus call</text>
  </g>
</svg>
