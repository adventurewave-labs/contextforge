<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="Faithfulness verification: facts checked against compressed output">
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff7847"/>
    </linearGradient>
  </defs>
  <style>
    .t{font:700 16px system-ui,sans-serif;fill:#dbe4f0}
    .s{font:400 12.5px system-ui,sans-serif;fill:#8b98ac}
    .m{font:600 13px ui-monospace,monospace}
  </style>
  <rect x="10" y="30" width="330" height="250" rx="12" fill="#151b26" stroke="#232c3b"/>
  <text class="t" x="30" y="60">Original context</text>
  <g class="m">
    <text x="30" y="95" fill="#8b98ac">renewal on </text><text x="115" y="95" fill="#ffb347">2026-11-01</text>
    <text x="30" y="120" fill="#8b98ac">quote of </text><text x="105" y="120" fill="#ffb347">$18,400/month</text>
    <text x="30" y="145" fill="#8b98ac">contact </text><text x="100" y="145" fill="#ffb347">maya@acme.example.com</text>
    <text x="30" y="170" fill="#8b98ac">limit </text><text x="85" y="170" fill="#ffb347">250M requests</text>
    <text x="30" y="195" fill="#8b98ac">owner </text><text x="90" y="195" fill="#ffb347">Robert Chen</text>
    <text x="30" y="220" fill="#8b98ac">dpa at </text><text x="95" y="220" fill="#ffb347">acme.example.com/dpa</text>
  </g>
  <text class="s" x="30" y="260">facts extracted: 14</text>

  <line x1="340" y1="155" x2="400" y2="155" stroke="#8b98ac" stroke-width="2" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b98ac"/>
    </marker>
  </defs>
  <rect x="400" y="90" width="150" height="130" rx="12" fill="#10141d" stroke="url(#g2)" stroke-width="2"/>
  <text class="t" x="420" y="120" font-size="15">Verify</text>
  <text class="s" x="420" y="145">numbers · dates</text>
  <text class="s" x="420" y="165">URLs · emails · names</text>
  <text class="s" x="420" y="185">quotes · quantities</text>
  <text class="s" x="420" y="208" fill="#4ade80">13 / 14 kept</text>
  <line x1="550" y1="155" x2="600" y2="155" stroke="#8b98ac" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="600" y="30" width="150" height="250" rx="12" fill="#151b26" stroke="#232c3b"/>
  <text class="t" x="620" y="60" font-size="15">Verdict</text>
  <text x="620" y="100" font-family="ui-monospace,monospace" font-size="30" font-weight="700" fill="#4ade80">93</text>
  <g class="m">
    <text x="620" y="140" fill="#4ade80">✓ 2026-11-01</text>
    <text x="620" y="162" fill="#4ade80">✓ $18,400/mo</text>
    <text x="620" y="184" fill="#4ade80">✓ Robert Chen</text>
    <text x="620" y="206" fill="#f87171">✗ email dropped</text>
  </g>
  <text class="s" x="620" y="245">raise ratio or add</text>
  <text class="s" x="620" y="263">a “must keep” hint</text>
</svg>
